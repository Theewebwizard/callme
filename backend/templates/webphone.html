<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Receptionist — Web Phone Call</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .phone-container {
      width: 100%;
      max-width: 440px;
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 36px;
      padding: 28px 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 40px rgba(99, 102, 241, 0.2);
      display: flex;
      flex-direction: column;
      gap: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Ambient glow behind avatar */
    .glow-effect {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 220px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, rgba(99, 102, 241, 0) 70%);
      pointer-events: none;
      z-index: 0;
      transition: all 0.5s ease;
    }

    .glow-effect.speaking {
      background: radial-gradient(circle, rgba(16, 185, 129, 0.45) 0%, rgba(16, 185, 129, 0) 70%);
      transform: translate(-50%, -50%) scale(1.3);
    }

    /* Header & Caller Info */
    .caller-header {
      text-align: center;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .avatar-wrapper {
      position: relative;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
    }

    .avatar-wrapper svg {
      width: 48px;
      height: 48px;
      fill: #ffffff;
    }

    .avatar-pulse {
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 2px solid rgba(99, 102, 241, 0.5);
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      opacity: 0;
    }

    .avatar-wrapper.active .avatar-pulse {
      opacity: 1;
      border-color: #10b981;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.2; }
    }

    .business-title {
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    .call-status {
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
    }

    .status-dot.active {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    /* Live Transcript Feed */
    .transcript-window {
      height: 220px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1;
    }

    .transcript-window::-webkit-scrollbar {
      width: 4px;
    }
    .transcript-window::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
    }

    .chat-bubble {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 13.5px;
      line-height: 1.45;
      animation: fadeIn 0.25s ease-out;
    }

    .chat-bubble.ai {
      align-self: flex-start;
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
    }

    .chat-bubble.user {
      align-self: flex-end;
      background: #4f46e5;
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    .chat-bubble.tool {
      align-self: center;
      background: rgba(16, 185, 129, 0.1);
      border: 1px dashed rgba(16, 185, 129, 0.4);
      color: #34d399;
      font-size: 11.5px;
      font-family: monospace;
      padding: 6px 12px;
      border-radius: 20px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Waveform indicator */
    .waveform-bar-container {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      z-index: 1;
    }

    .wave-bar {
      width: 3px;
      height: 6px;
      background: #6366f1;
      border-radius: 3px;
      transition: height 0.1s ease;
    }

    .waveform-bar-container.active .wave-bar {
      animation: wave 1s ease-in-out infinite alternate;
    }

    .waveform-bar-container.active .wave-bar:nth-child(2) { animation-delay: 0.15s; }
    .waveform-bar-container.active .wave-bar:nth-child(3) { animation-delay: 0.3s; }
    .waveform-bar-container.active .wave-bar:nth-child(4) { animation-delay: 0.45s; }
    .waveform-bar-container.active .wave-bar:nth-child(5) { animation-delay: 0.2s; }
    .waveform-bar-container.active .wave-bar:nth-child(6) { animation-delay: 0.35s; }

    @keyframes wave {
      0% { height: 6px; }
      100% { height: 26px; background: #10b981; }
    }

    /* Controls */
    .call-controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 1;
    }

    .primary-btn {
      width: 100%;
      height: 56px;
      border-radius: 18px;
      border: none;
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-call {
      background: #10b981;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
    }

    .btn-call:hover {
      background: #059669;
      transform: translateY(-1px);
    }

    .btn-hangup {
      background: #ef4444;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(239, 68, 68, 0.35);
    }

    .btn-hangup:hover {
      background: #dc2626;
      transform: translateY(-1px);
    }

    /* Push-To-Talk Mic Button */
    .mic-btn-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-mic {
      flex: 1;
      height: 48px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.05);
      color: #e2e8f0;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-mic:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-mic.recording {
      background: #ef4444;
      color: #ffffff;
      border-color: #ef4444;
      animation: recordingPulse 1.5s infinite;
    }

    @keyframes recordingPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
      50% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
    }

    /* Text Input Fallback */
    .text-input-row {
      display: flex;
      gap: 8px;
    }

    .text-input {
      flex: 1;
      height: 44px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
      padding: 0 14px;
      font-size: 13.5px;
      outline: none;
    }

    .text-input:focus {
      border-color: #6366f1;
    }

    .btn-send {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      border: none;
      background: #6366f1;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .btn-send:hover {
      background: #4f46e5;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <div class="glow-effect" id="glow"></div>

    <!-- Caller Header -->
    <div class="caller-header">
      <div class="avatar-wrapper" id="avatarWrapper">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/>
        </svg>
        <div class="avatar-pulse"></div>
      </div>
      <div class="business-title" id="businessTitle">AI Voice Receptionist</div>
      <div class="call-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="callStatusText">Ready to Call</span>
      </div>
    </div>

    <!-- Live Transcript -->
    <div class="transcript-window" id="transcriptWindow">
      <div class="chat-bubble ai">
        👋 Click <strong>"Start Voice Call"</strong> below to connect with your AI receptionist!
      </div>
    </div>

    <!-- Audio Visualizer Waveform -->
    <div class="waveform-bar-container" id="waveform">
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
      <div class="wave-bar"></div>
    </div>

    <!-- Controls -->
    <div class="call-controls">
      <!-- Call / Hangup Buttons -->
      <button class="primary-btn btn-call" id="btnCall" onclick="startCall()">
        <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
          <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-2.2 2.2a15.053 15.053 0 0 1-6.59-6.59l2.2-2.21a.96.96 0 0 0 .25-1.01A11.36 11.36 0 0 1 8.57 3.9c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.52c0-.55-.45-1-.99-1z"/>
        </svg>
        Start Voice Call
      </button>

      <button class="primary-btn btn-hangup hidden" id="btnHangup" onclick="hangupCall()">
        <svg width="22" height="22" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.996.996 0 0 1 0-1.41C3.25 8.91 7.42 7.5 12 7.5s8.75 1.41 11.71 4.17c.39.39.39 1.02 0 1.41l-2.48 2.48c-.18.18-.43.29-.71.29s-.52-.11-.7-.28c-.79-.74-1.69-1.36-2.67-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
        </svg>
        End Call
      </button>

      <!-- Active Call Options (Mic & Text) -->
      <div class="mic-btn-container hidden" id="activeControls">
        <button class="btn-mic" id="btnMic" onclick="toggleMicrophone()">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
            <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
          </svg>
          <span id="micText">Tap to Speak</span>
        </button>
      </div>

      <div class="text-input-row hidden" id="textInputRow">
        <input type="text" class="text-input" id="userTextInput" placeholder="Or type a message..." onkeydown="if(event.key==='Enter') sendTextMessage()">
        <button class="btn-send" onclick="sendTextMessage()">
          <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    let activeSessionId = null;
    let callTimerInterval = null;
    let callSeconds = 0;
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;
    let currentAudioPlayer = null;

    const btnCall = document.getElementById('btnCall');
    const btnHangup = document.getElementById('btnHangup');
    const activeControls = document.getElementById('activeControls');
    const textInputRow = document.getElementById('textInputRow');
    const btnMic = document.getElementById('btnMic');
    const micText = document.getElementById('micText');
    const callStatusText = document.getElementById('callStatusText');
    const statusDot = document.getElementById('statusDot');
    const avatarWrapper = document.getElementById('avatarWrapper');
    const waveform = document.getElementById('waveform');
    const glow = document.getElementById('glow');
    const transcriptWindow = document.getElementById('transcriptWindow');

    function formatTime(s) {
      const mins = Math.floor(s / 60).toString().padStart(2, '0');
      const secs = (s % 60).toString().padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function addTranscript(role, text) {
      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${role}`;
      bubble.innerHTML = text;
      transcriptWindow.appendChild(bubble);
      transcriptWindow.scrollTop = transcriptWindow.scrollHeight;
    }

    function playAudioBase64(base64Data, onEndCallback) {
      if (!base64Data) {
        if (onEndCallback) onEndCallback();
        return;
      }
      if (currentAudioPlayer) {
        currentAudioPlayer.pause();
      }
      waveform.classList.add('active');
      glow.classList.add('speaking');
      avatarWrapper.classList.add('active');

      currentAudioPlayer = new Audio('data:audio/wav;base64,' + base64Data);
      currentAudioPlayer.onended = () => {
        waveform.classList.remove('active');
        glow.classList.remove('speaking');
        avatarWrapper.classList.remove('active');
        if (onEndCallback) onEndCallback();
      };
      currentAudioPlayer.onerror = () => {
        waveform.classList.remove('active');
        glow.classList.remove('speaking');
        avatarWrapper.classList.remove('active');
        if (onEndCallback) onEndCallback();
      };
      currentAudioPlayer.play().catch(e => {
        console.warn('Audio auto-play blocked by browser, user interaction required:', e);
        waveform.classList.remove('active');
        glow.classList.remove('speaking');
        avatarWrapper.classList.remove('active');
        if (onEndCallback) onEndCallback();
      });
    }

    async function startCall() {
      btnCall.classList.add('hidden');
      callStatusText.textContent = 'Connecting...';
      statusDot.classList.add('active');

      try {
        const urlParams = new URLSearchParams(window.location.search);
        const reqPayload = {};
        if (urlParams.get('biz')) {
          reqPayload.business_id = urlParams.get('biz');
        }

        const resp = await fetch('/api/voice/web/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(reqPayload)
        });
        const data = await resp.json();

        if (data.business_name) {
          const titleElem = document.getElementById('businessTitle');
          if (titleElem) titleElem.textContent = data.business_name;
        }

        activeSessionId = data.session_id;
        callSeconds = 0;
        callTimerInterval = setInterval(() => {
          callSeconds++;
          callStatusText.textContent = `Call in Progress (${formatTime(callSeconds)})`;
        }, 1000);

        btnHangup.classList.remove('hidden');
        activeControls.classList.remove('hidden');
        textInputRow.classList.remove('hidden');

        // Add greeting to transcript and play greeting audio
        const hostLabel = data.business_name ? `<strong>${data.business_name} Receptionist:</strong>` : '<strong>Receptionist:</strong>';
        addTranscript('ai', `${hostLabel} ${data.greeting_text}`);
        playAudioBase64(data.audio_base64, () => {
          // Auto-start listening after greeting finishes
          autoStartListening();
        });

      } catch (err) {
        console.error('Call failed:', err);
        callStatusText.textContent = 'Failed to connect';
        statusDot.classList.remove('active');
        btnCall.classList.remove('hidden');
      }
    }

    async function hangupCall() {
      if (currentAudioPlayer) currentAudioPlayer.pause();
      if (callTimerInterval) clearInterval(callTimerInterval);
      if (mediaRecorder && isRecording) mediaRecorder.stop();

      callStatusText.textContent = 'Call Ended';
      statusDot.classList.remove('active');
      waveform.classList.remove('active');
      glow.classList.remove('speaking');
      avatarWrapper.classList.remove('active');

      btnHangup.classList.add('hidden');
      activeControls.classList.add('hidden');
      textInputRow.classList.add('hidden');
      btnCall.classList.remove('hidden');

      if (activeSessionId) {
        try {
          await fetch('/api/voice/web/hangup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ session_id: activeSessionId })
          });
        } catch (e) {
          console.warn('Hangup notification failed:', e);
        }
        activeSessionId = null;
      }
    }

    async function toggleMicrophone() {
      if (isRecording) {
        stopRecordingAndSend();
      } else {
        startRecording();
      }
    }

    async function startRecording() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => {
          if (e.data.size > 0) audioChunks.push(e.data);
        };
        mediaRecorder.onstop = sendRecordedAudio;
        mediaRecorder.start();

        isRecording = true;
        btnMic.classList.add('recording');
        micText.textContent = 'Listening... (Tap to Send)';
        waveform.classList.add('active');
      } catch (err) {
        alert('Could not access microphone: ' + err.message + '\nYou can also type your message in the box below!');
      }
    }

    function stopRecordingAndSend() {
      if (mediaRecorder && isRecording) {
        mediaRecorder.stop();
        isRecording = false;
        btnMic.classList.remove('recording');
        micText.textContent = 'Processing speech...';
        waveform.classList.remove('active');
      }
    }

    function autoStartListening() {
      // Optional subtle prompt
      micText.textContent = 'Tap to Speak';
    }

    async function sendRecordedAudio() {
      if (!audioChunks.length || !activeSessionId) return;

      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      audioChunks = [];

      const formData = new FormData();
      formData.append('session_id', activeSessionId);
      formData.append('audio', audioBlob, 'caller.webm');

      await executeTurn(formData);
    }

    async function sendTextMessage() {
      const input = document.getElementById('userTextInput');
      const text = input.value.trim();
      if (!text || !activeSessionId) return;

      input.value = '';
      const formData = new FormData();
      formData.append('session_id', activeSessionId);
      formData.append('text', text);

      await executeTurn(formData);
    }

    async function executeTurn(formData) {
      micText.textContent = 'Agent thinking...';
      try {
        const resp = await fetch('/api/voice/web/turn', {
          method: 'POST',
          body: formData
        });
        const data = await resp.json();

        // 1. Show user speech in transcript
        if (data.user_text) {
          addTranscript('user', data.user_text);
        }

        // 2. Show tool calls if any
        if (data.tool_calls && data.tool_calls.length) {
          data.tool_calls.forEach(tc => {
            addTranscript('tool', `⚙️ Executed tool: ${tc}`);
          });
        }

        // 3. Show AI reply in transcript
        if (data.assistant_text) {
          addTranscript('ai', `<strong>Host:</strong> ${data.assistant_text}`);
        }

        // 4. Play assistant voice reply
        playAudioBase64(data.audio_base64, () => {
          micText.textContent = 'Tap to Speak';
          if (data.should_terminate) {
            hangupCall();
          }
        });

      } catch (err) {
        console.error('Turn processing failed:', err);
        micText.textContent = 'Tap to Speak';
      }
    }
  </script>
</body>
</html>
