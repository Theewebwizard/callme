services:
  - type: web
    name: callme-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ENVIRONMENT
        value: production
      - key: TOOL_EXECUTION_MODE
        value: mock
      - key: GNANI_API_BASE
        value: https://api.vachana.ai
      - key: GNANI_STT_MODEL
        value: prisma-v3.0
      - key: GNANI_TTS_MODEL
        value: timbre-v2.5
      - key: GNANI_TTS_VOICE
        value: Nalini
      - key: GNANI_DEFAULT_LANGUAGE
        value: hi-IN
